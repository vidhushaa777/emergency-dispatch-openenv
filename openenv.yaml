name: emergency-dispatch
version: "1.0.0"
description: >
  An OpenEnv environment simulating real-world emergency dispatch coordination.
  An LLM agent acts as a dispatch coordinator, receiving structured incident
  reports and unit statuses, then issuing dispatch decisions. Tasks range from
  standard mixed dispatch (easy) to mass casualty triage (medium) to
  resource-scarce multi-crisis coordination (hard).

domain: public-safety
tags: [dispatch, scheduling, triage, resource-management, real-world]

observation_space:
  type: structured
  format: json
  description: >
    Active incidents (id, type, priority, location, description, age),
    unit statuses (id, type, fuel, status, location),
    episode statistics (resolved count, avg response time, cumulative reward).

action_space:
  type: structured
  format: json
  description: >
    List of dispatch decisions. Each decision: unit_id (string),
    incident_id (string or null for return-to-base), optional reasoning.

reward:
  range: [-1.0, 1.0]
  normalized: true
  shaped: true
  description: >
    Partial progress reward on every step. Positive: incident resolution
    (scaled by priority and speed), correct dispatch bonus.
    Negative: wrong-type dispatch, incident escalation, fuel depletion,
    step penalty. Final episode scored 0.0–1.0 by task grader.

tasks:
  - id: standard_dispatch
    name: Standard Dispatch
    difficulty: easy
    max_steps: 40
    success_threshold: 0.55
    description: Mixed incident types, balanced priorities, full fuel.

  - id: mass_casualty
    name: Mass Casualty Event
    difficulty: medium
    max_steps: 50
    success_threshold: 0.65
    description: Surge of high-priority medical incidents. Triage required.

  - id: resource_scarcity
    name: Resource Scarcity Crisis
    difficulty: hard
    max_steps: 60
    success_threshold: 0.70
    description: All incident types surge simultaneously. Units start at 35% fuel.

endpoints:
  reset: POST /reset
  step:  POST /step
  state: GET  /state
  grade: GET  /grade
  tasks: GET  /tasks
  health: GET /health

baseline:
  script: inference.py
  model: gpt-4o-mini
  seed: 42
  expected_scores:
    standard_dispatch: 0.61
    mass_casualty: 0.54
    resource_scarcity: 0.41
